name: Publisher image

# The publisher is the one part of GoodBit someone else has to run, and asking
# them to clone a repository and build a container first is a wall in front of
# an optional feature. This pushes a ready image for both processors people
# actually have: a NAS or a Pi is arm64, everything else is amd64.
#
# Only when the publisher itself changes. It used to run on every release tag,
# which rebuilt an identical image for a release that had touched nothing in
# `publisher/` — the app and the publisher are versioned and shipped
# separately, and there is no reason for one to drag the other along.
on:
  push:
    branches: [main]
    paths:
      - 'publisher/**'
      - '.github/workflows/publisher-image.yml'
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      # A missing credential must not fail the run: a red cross on every push
      # for a fork that has no Docker Hub access teaches everyone to ignore red
      # crosses. It says so and stops instead.
      #
      # This is a step rather than a job-level `if` because the `secrets`
      # context is not available there, only `vars` and `github` are.
      - name: Are the credentials here?
        id: creds
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE: ${{ secrets.PUBLISHER_IMAGE }}
        run: |
          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_TOKEN" ] && [ -n "$IMAGE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Docker Hub credentials, so no image was pushed. Set DOCKERHUB_USERNAME, DOCKERHUB_TOKEN and PUBLISHER_IMAGE as repository secrets."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - name: Which version is this
        id: meta
        if: steps.creds.outputs.ready == 'true'
        # The publisher's own version, not the app's: they ship separately.
        run: |
          version=$(node -p "require('./publisher/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.creds.outputs.ready == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.ready == 'true'

      - uses: docker/login-action@v3
        if: steps.creds.outputs.ready == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build for both processors and push
        if: steps.creds.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./publisher
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.PUBLISHER_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ secrets.PUBLISHER_IMAGE }}:latest
          # Layers are cached between runs, so a change to one source file does
          # not reinstall the dependencies again — which matters most for
          # arm64, where every command runs under emulation. Scoped by name so
          # it cannot collide with another workflow's cache in this repository.
          cache-from: type=gha,scope=publisher
          cache-to: type=gha,mode=max,scope=publisher
