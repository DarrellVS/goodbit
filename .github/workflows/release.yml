name: Release

# Tag-triggered only. Building an installer on every push would burn minutes on
# an artefact nobody downloads.
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Not `build:win`: that depends on the Playwright suite, which cannot run
      # in a container. Those are the gate on a real machine before the tag is
      # pushed, so by this point they have already passed.
      - name: Build
        run: npm run build

      # One release for the artefacts to attach to, made before anything
      # uploads.
      #
      # electron-builder uploads artefacts concurrently and each upload creates
      # the release if it cannot find one, so on 2.0.0 two of them raced and
      # both won: one release got the installers and `latest.yml`, a second got
      # nothing but the `.blockmap`. Creating it here means there is always one
      # to find.
      #
      # `|| true` because a re-run of the same tag will find it already there,
      # and that is not a failure.
      - name: Make the release
        shell: bash
        run: gh release create "$TAG" --draft --title "GoodBit ${TAG#v}" --notes "Built from $TAG." || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

      - name: Package and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder names the draft after the version alone, so the list
      # read "GoodBit 1.3.2" down to "1.3.3" and "1.3.4" once nobody renamed
      # them by hand. The tag is the only input, so this cannot drift again.
      # bash, not the runner's default pwsh: ${TAG#v} is a shell parameter
      # expansion, and PowerShell reads it as an empty variable, so the step
      # asked to rename a release with no tag and failed with "release not
      # found".
      - name: Name it after the app
        shell: bash
        run: gh release edit "$TAG" --title "GoodBit ${TAG#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
