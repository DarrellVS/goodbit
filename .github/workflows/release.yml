name: Release

# Tag-triggered only. Building an installer on every push would burn minutes on
# an artefact nobody downloads.
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Not `build:win`: that depends on the Playwright suite, which cannot run
      # in a container. Those are the gate on a real machine before the tag is
      # pushed, so by this point they have already passed.
      - name: Build
        run: npm run build

      - name: Package and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder names the draft after the version alone, so the list
      # read "GoodBit 1.3.2" down to "1.3.3" and "1.3.4" once nobody renamed
      # them by hand. The tag is the only input, so this cannot drift again.
      - name: Name it after the app
        run: gh release edit "$TAG" --title "GoodBit ${TAG#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
