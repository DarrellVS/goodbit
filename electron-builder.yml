appId: com.darrellvs.goodbit
productName: GoodBit
copyright: Copyright © 2026 Darrell van Swinderen

directories:
  output: release
  buildResources: build

# Windows names the program by the executable's FileDescription, not by
# productName: Task Manager, the "Open with" list, and the prompt a browser
# puts up before handing over a `goodbit://` link all read that field. It comes
# from `description`, which is a sentence, so the browser asked whether to
# "Open Finds the good bit in your game clips, and keeps it."
#
# The sentence is still the right thing on GitHub and in the README, so it is
# only the packaged copy that carries the name instead.
extraMetadata:
  description: GoodBit

files:
  - out/**
  - package.json

# ffmpeg and ffprobe are binaries that get spawned, and better-sqlite3 is a
# native module. A packaged .exe cannot be executed from inside an asar
# archive, and a .node cannot be loaded from one, so these stay unpacked on
# disk. better-sqlite3 ships one Node-API binary per platform under
# prebuilds/, which is the file that has to survive packaging.
asarUnpack:
  - '**/node_modules/ffmpeg-static/**'
  - '**/node_modules/ffprobe-static/**'
  - '**/node_modules/better-sqlite3/**'

# The tray needs the icon as a file at runtime; the exe's embedded icon is not
# reachable from JavaScript. Lands at process.resourcesPath/icon.png.
extraResources:
  - from: build/icon.png
    to: icon.png
  # The Stream Deck plugin, so Settings, Connections can install it in one
  # press. Built by `npm run build:streamdeck`, which `build:win` runs first.
  - from: streamdeck-plugin/dist/io.github.darrellvs.goodbit.streamDeckPlugin
    to: streamdeck/io.github.darrellvs.goodbit.streamDeckPlugin

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Unsigned on purpose: a certificate is a yearly cost, and SmartScreen's
  # warning is documented in the README instead.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: GoodBit-${version}-portable.exe

publish:
  provider: github
  owner: DarrellVS
  repo: goodbit
